name: Security validation

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  audit:
    name: Audit ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - agenda
          - Buscador_NodeJs
          - reactjs/app_live-server
          - reactjs/chat-webpack-firebase
          - reactjs/primera-app
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=high

  build:
    name: Build ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - reactjs/app_live-server
          - reactjs/chat-webpack-firebase
          - reactjs/primera-app
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run build
